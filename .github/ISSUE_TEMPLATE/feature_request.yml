name: 功能建议
description: 提出一个有明确用户价值和边界的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: user_problem
    attributes:
      label: 用户问题
      description: 谁在什么场景下遇到了什么问题？请先描述问题，不要只列功能名。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述最小可用方案，以及用户如何知道它已经解决问题。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: impact
    attributes:
      label: 隐私、安全、成本与范围影响
      description: 是否新增数据留存、第三方服务、模型调用、权限、角色表达或发布风险？
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: 产品边界
      options:
        - label: 我已阅读产品框架，并说明了建议与一次性体验、证据链和表达边界的关系。
          required: true
