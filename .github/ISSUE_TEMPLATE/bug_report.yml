name: 缺陷报告
description: 提交一个可以使用非敏感数据复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请只使用虚构或充分脱敏的材料；安全漏洞请改用 Private Vulnerability Reporting。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？它影响了哪个用户流程？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选择……
        2. 输入……
        3. 点击……
        4. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      options:
        - 微信小程序界面
        - 文件上传或解析
        - AI 诊断或结构化报告
        - 云函数或临时存储
        - 分享海报
        - 本地开发、测试或文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Node.js、微信开发者工具版本、设备与基础库版本等。不要填写 AppID、环境 ID 或凭据。
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的日志或截图
      description: 删除材料正文、文件名、fileID、Token、路径中的用户名及其他可识别信息。
  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认内容不含真实用户材料、凭据或可识别个人信息。
          required: true
        - label: 这不是需要私下披露的未修复安全漏洞。
          required: true
